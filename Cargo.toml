[package]
name = "terminal-art-launcher"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
description = "An Arch Linux terminal candy launcher, installer, and workspace preset manager"
repository = "https://github.com/RobertRGreen/terminal-art-launcher"
readme = "README.md"
keywords = ["arch-linux", "terminal", "tui", "art", "launcher"]
categories = ["command-line-utilities"]
license = "MIT"

[[bin]]
name = "art"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.28"
dirs = "6"
nix = { version = "0.29", features = ["signal", "process", "user"] }
rand = "0.8"
ratatui = "0.29"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
toml = "0.8"

[profile.release]
lto = "thin"
strip = true
